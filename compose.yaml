services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-registration}
      POSTGRES_USER: ${POSTGRES_USER:-registration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-registration_dev_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-registration}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --save 60 1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-registration}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-registration_dev_only}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"

  api:
    build: ./apps/api
    env_file: .env
    volumes:
      - ./apps/api/app:/app/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./apps/web
    volumes:
      - ./apps/web/src:/app/src
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  minio-data:

